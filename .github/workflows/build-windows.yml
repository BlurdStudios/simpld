name: Build Windows

# Real Windows .exe + installer, built on a cloud Windows runner.
# (PyInstaller cannot cross-compile from Linux; the local Wine route is
# documented as blocked in DEMO_WINDOWS.md.)
#
# Branch pushes -> build + artifacts (smoke test).
# Version tags (v1.2.3) -> same build, then a GitHub Release carrying the
# installer and its .sha256 — that release is what every installed copy of
# Simpl'd auto-updates from (see UPDATES.md). The tag must match
# factory/version.py, or the release job fails before anything is published.
#
# Editions: the build job runs twice per trigger — prod (the floor build,
# no Demo switch) and demo (same commit with DEMO_ENABLED flipped to True,
# installer renamed Simpld-Setup-X.Y.Z-demo.exe). Demo installers are
# USB-handout only: they are uploaded as CI artifacts and NEVER published
# to the release mirror, so the fleet can never auto-update into one.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # Offscreen on Windows uses Qt's FreeType font database, which only
      # scans QT_QPA_FONTDIR (Qt ships no fonts, and the Windows GDI font
      # list is invisible to it). Unset, no text renders at all and every
      # slip PDF comes out with no text layer — the PDF tests then fail
      # with empty pdftotext output.
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'
      SIMPLD_ALLOW_MOCK: "1"
      # Unbuffered output: a crashed pytest otherwise loses its buffered
      # progress/failure text (learned from the first CI runs).
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Fails with one clear message instead of six confusing PDF text
      # failures if the headless font database above ever goes missing.
      - name: Check headless Qt fonts
        run: |
          python -c "from PySide6.QtGui import QGuiApplication, QFontDatabase; app = QGuiApplication([]); fams = QFontDatabase.families(); assert 'Arial' in fams, 'no Arial among %d families' % len(fams); print('fonts OK:', len(fams), 'families')"

      # One interpreter per test file. In a single process the Qt tests
      # eventually abort the interpreter (Windows access violation; the
      # fault site moves between unrelated tests, so it is process state —
      # see the 2026-10-17 CI note in plans/README.md). Each file passes on
      # its own, and tools/run_tests.py retries a crashed file once.
      # SIMPLD_DB must stay per-step: the runner context is not available in
      # job-level env.
      - name: Run test suite (one process per file)
        env:
          SIMPLD_DB: ${{ runner.temp }}\test-factory.db
        run: python tools/run_tests.py

      # The suite runs headless under offscreen (FreeType fonts). The
      # shipped app uses the native Windows platform (DirectWrite fonts),
      # so render the PDF evidence tests there too: their pdftotext checks
      # then cover the exact engine production uses. One process per file
      # (same Qt/PySide6 teardown-crash rationale as the main suite): a
      # teardown crash in one file must not fail the other.
      - name: Run PDF tests on the native Windows platform
        env:
          QT_QPA_PLATFORM: windows
          SIMPLD_DB: ${{ runner.temp }}\test-factory.db
        shell: pwsh
        run: |
          python -m pytest tests/test_slip_pdf.py -q -p no:cacheprovider
          $e1 = $LASTEXITCODE
          python -m pytest tests/test_slip_evidence.py -q -p no:cacheprovider
          $e2 = $LASTEXITCODE
          if ($e1 -ne 0 -or $e2 -ne 0) { throw "native PDF tests failed ($e1, $e2)" }

      # On failure, re-run just the failing files fail-fast: a pytest that
      # dies mid-test (native crash) never prints its failure summary, and
      # this captures the first real traceback instead. Kept as insurance
      # while the Qt/PySide6 crash family is open (plans/README.md).
      - name: Diagnose (fail fast, first traceback)
        if: failure()
        continue-on-error: true
        env:
          SIMPLD_DB: ${{ runner.temp }}\test-factory.db
        shell: pwsh
        run: |
          if (-not (Test-Path .pytest-failed-files)) { exit 0 }
          Get-Content .pytest-failed-files | Where-Object { $_ } | ForEach-Object {
            Write-Host "::group::$_"
            python -m pytest $_ -q -p no:cacheprovider -x
            Write-Host "::endgroup::"
          }

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - edition: prod
            artifact_suffix: ''
          - edition: demo
            artifact_suffix: '-demo'
    permissions:
      contents: write   # create the GitHub Release on version tags
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build/windows/build_requirements.txt

      # Demo installers come from the SAME commit as prod: flip the baked
      # edition flag before building, so the frozen app has demo enabled.
      # The exe version metadata stays numeric (VERSION is untouched).
      - name: Enable the demo edition (demo installers only)
        if: matrix.edition == 'demo'
        run: |
          python -c "from pathlib import Path; p = Path('factory/version.py'); s = p.read_text(); assert 'DEMO_ENABLED = False' in s, 'edition flag missing in factory/version.py'; p.write_text(s.replace('DEMO_ENABLED = False', 'DEMO_ENABLED = True'))"
          python -c "from factory.version import VERSION, DEMO_ENABLED; assert DEMO_ENABLED is True; print('demo edition:', VERSION, DEMO_ENABLED)"

      - name: Resolve version (tag must match factory/version.py)
        shell: pwsh
        run: |
          $declared = (python -c "from factory.version import VERSION; print(VERSION)").Trim()
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagged = "${{ github.ref_name }}".TrimStart("v")
            if ($tagged -ne $declared) {
              throw "Tag v$tagged does not match factory/version.py ($declared). Bump the version file in the tagged commit, or retag."
            }
            $appVersion = $tagged
          } else {
            $appVersion = $declared
          }
          echo "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          echo "Building Simpl'd $appVersion"

      - name: Build exe (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm build/windows/simpld.spec

      - name: Verify exe exists
        run: |
          if (!(Test-Path "dist/Simpld/Simpld.exe")) { throw "Simpld.exe missing" }
          Get-ChildItem dist/Simpld | Select-Object -First 5 Name

      # Guards the single-source rule: the exe's own version resource must
      # carry the same version as factory/version.py, the installer and the
      # tag (a one-time stale version_info.txt shipped 1.0.0 metadata).
      - name: Verify exe version resource matches app version
        shell: pwsh
        run: |
          $vi = (Get-Item "dist/Simpld/Simpld.exe").VersionInfo
          if ($vi.ProductVersion -ne $env:APP_VERSION) {
            throw "Simpld.exe ProductVersion '$($vi.ProductVersion)' != '$env:APP_VERSION'"
          }
          echo "exe version resource OK: $($vi.ProductVersion)"

      - name: Compile installer (Inno Setup)
        run: |
          choco install innosetup -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:APP_VERSION build\windows\simpld.iss

      - name: Write installer checksum (.sha256)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/Simpld-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "installer missing" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          # sha256sum format: the updater and tools/publish_update.py read the
          # first token, so the exact layout is part of the contract.
          "$hash  $($exe.Name)" | Out-File -NoNewline -Encoding ascii "$($exe.FullName).sha256"
          Get-Content "$($exe.FullName).sha256"

      # Demo installers must be unmistakable on a USB stick: rename to
      # Simpld-Setup-X.Y.Z-demo.exe (with a matching .sha256) and drop the
      # prod-named files, so the artifact upload below picks up only these.
      - name: Rename the demo installer (demo installers only)
        if: matrix.edition == 'demo'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/Simpld-Setup-*.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "installer missing" }
          $demo = $exe -replace '\.exe$', '-demo.exe'
          Rename-Item $exe $demo
          Remove-Item "$exe.sha256"
          $hash = (Get-FileHash $demo -Algorithm SHA256).Hash.ToLower()
          "$hash  $((Get-Item $demo).Name)" | Out-File -NoNewline -Encoding ascii "$demo.sha256"
          Get-Content "$demo.sha256"

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: Simpld-windows${{ matrix.artifact_suffix }}
          path: dist/Simpld/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Simpld-Setup${{ matrix.artifact_suffix }}
          path: |
            dist/Simpld-Setup-*.exe
            dist/Simpld-Setup-*.exe.sha256

      # The source repo is private, so its releases are unreadable to an
      # installed copy checking anonymously (the API 404s without a token).
      # Only the installer and its checksum go to the public mirror; the
      # updater reads that mirror with no credentials (see UPDATES.md).
      # Prod only: demo installers stay USB-handouts, never auto-updates.
      - name: Publish to the public release mirror (version tags only)
        if: github.ref_type == 'tag' && matrix.edition == 'prod'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.RELEASE_MIRROR_REPO }}
        run: |
          if (-not $env:MIRROR_TOKEN) {
            throw "RELEASE_MIRROR_TOKEN is not set. Add a fine-grained PAT with Contents: write on the public mirror repo (UPDATES.md, 'Release mirror setup')."
          }
          $mirror = if ($env:MIRROR_REPO) { $env:MIRROR_REPO.Trim() } else { "BlurdStudios/simpld-releases" }

          # pwsh does not expand wildcards for native commands — resolve
          # the two asset paths first (gh does not glob either).
          $exe = (Get-ChildItem dist/Simpld-Setup-*.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "installer missing" }
          $sha = "$exe.sha256"

          # Notes come from THIS repo's history: the mirror has no source
          # commits, so --generate-notes there would be empty.
          $notes = gh api --method POST "repos/${{ github.repository }}/releases/generate-notes" `
            -f tag_name="${{ github.ref_name }}" --jq .body
          if ($LASTEXITCODE -ne 0) { throw "could not generate release notes" }
          $notes | Out-File -Encoding utf8 release-notes.md

          # Re-running a tag must be safe: refresh the assets in place
          # instead of failing on an existing release.
          $env:GH_TOKEN = $env:MIRROR_TOKEN
          gh release view "${{ github.ref_name }}" -R $mirror *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $exe $sha -R $mirror --clobber
            if ($LASTEXITCODE -ne 0) { throw "uploading assets to $mirror failed" }
            gh release edit "${{ github.ref_name }}" -R $mirror --title "Simpl'd $env:APP_VERSION" --notes-file release-notes.md
          } else {
            gh release create "${{ github.ref_name }}" $exe $sha -R $mirror `
              --title "Simpl'd $env:APP_VERSION" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing to $mirror failed" }
          echo "Published ${{ github.ref_name }} to $mirror"
